controller_manager:
  ros__parameters:
    update_rate: 1000  # 1000 Hz è lo standard per i bracci UR

    # 1. Broadcaster: Legge gli angoli da Gazebo e li passa a ROS
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # 2. Muscoli del braccio: Gestisce le traiettorie fluide
    ur_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # 3. Muscoli della pinza: Gestisce l'apertura e chiusura in simulazione
    robotiq_gripper_controller:
      type: position_controllers/GripperActionController

# ==========================================
# CONFIGURAZIONE DEL BRACCIO UR5
# ==========================================
ur_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

# ==========================================
# CONFIGURAZIONE DELLA PINZA ROBOTIQ
# ==========================================
robotiq_gripper_controller:
  ros__parameters:
    default: true
    joint: robotiq_85_left_knuckle_joint
    # Usiamo l'interfaccia di posizione per evitare tremolii fisici in Gazebo
    action_monitor_rate: 20.0